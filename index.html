<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet.js Karte mit Mehrfachfiltern - Steiermark</title>

    <!-- Leaflet CSS einbinden -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    
    <!-- Leaflet JS einbinden -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <!-- Kartengröße festlegen -->
    <style>
        #map {
            height: 700px;  
            width: 100%;   
        }
    </style>
</head>
<body>

    <!-- Dropdown-Menüs für die Filter -->
    <label for="application-filter">Anwendungsbereich:</label>
    <select id="application-filter" onchange="applyFilters()">
        <option value="all">Alle</option>
        <option value="frueherkennung">Früherkennung</option>
        <option value="praeventative_massnahmen">Präventative Maßnahmen</option>
        <option value="alltagszentriert">Alltagszentriert</option>
    </select>

    <label for="tech-filter">Technikorientierte Einteilung der Technologie:</label>
    <select id="tech-filter" onchange="applyFilters()">
        <option value="all">Alle</option>
        <option value="neurale_schnittstellen">Neurale Schnittstellen und Monitoring</option>
        <option value="neuromodulation_therapie">Neuromodulation und Therapie</option>
        <option value="ki_datenanalyse_biologische_daten">KI und Datenanalyse von biologischen Daten</option>
        <option value="ki_iot_monitoring">KI und IoT - Monitoring</option>
        <option value="pflegeroboter">Pflegeroboter: Soziale Roboter, Assistenzroboter</option>
        <option value="ki_anwendungen">Andere KI Anwendungen: VR, Chatbots, Serious Games, TeleCare</option>
    </select>

    <!-- Hier wird die Karte angezeigt -->
    <div id="map"></div>

    <script>
    
        var map = L.map('map').setView([47.3333, 15.3333], 9); 

     
        var bounds = [[46.17, 14.35], [47.75, 16.15]]; 
        map.setMaxBounds(bounds); 
        map.on('drag', function() {
            map.panInsideBounds(bounds); 
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var locations = [
            {
                lat: 47.069650, lng: 15.450052, 
                application: 'frueherkennung', 
                tech: 'neurale_schnittstellen', 
                name: 'INTRECOM',
                description: 'INTRECOM entwickelt ein implantierbares BCI, das Gehirnsignale in Echtzeit aufzeichnen soll. Diese Gehirnsignale sollen drahtlos an einen Computer übertragen werden, der die Signale analysiert und in die Worte übersetzt, die eine Person mit Sprachstörung sagen möchte. Demenz wird in diesem Kontext nicht berücksichtigt.',
                link: 'https://intrecom.eu/project/',
                organization: 'Technische Universität Graz'
            },
            {
                lat: 47.069518, lng: 15.410234, 
                application: 'alltagszentriert', 
                tech: 'neurale_schnittstellen', 
                name: 'SCOBES-AR',
                description: 'SCOBES-AR hat das Ziel, auf Basis von Video-Seethrough AR Technik ein multimodales Screening-Instrument zur Früherkennung des Risikos für neurokognitive Einschränkungen für den ambulanten Versorgungsbereich zu entwickeln.',
                link: 'https://projekte.ffg.at/projekt/3014961',
                organization: 'FH JOANNEUM'
            },
                        {
                lat: 47.043209, lng: 15.406530, 
                application: 'alltagszentriert', 
                tech: 'ki_anwendungen', 
                name: 'KI in der Pflege',
                description: 'Entwicklung einer künstlichen Intelligenz zur Unterstützung bei der Pflegediagnostik und Pflegeplanerstellung',
                link: 'https://projekte.ffg.at/projekt/4159813',
                organization: 'treffingerKling(IT) OG'
            },
                                    {
                lat: 47.077543, lng: 15.449205, 
                application: 'frueherkennung', 
                tech: 'ki_anwendungen', 
                name: 'DigIDe',
                description: 'DigIDe entwickelt einen digitalen Prototyp zur frühzeitigen Erkennung einer demenziellen Erkrankung bei Menschen mit intellektueller Beeinträchtigung.',
                link: 'https://stmk.arbeiterkammer.at/beratung/DiglDe_-_Karl-Franzens-Universitaet_Graz_.html',
                organization: 'Universität Graz'
            },
                                                {
                lat: 47.077772, lng: 15.448503, 
                application: 'frueherkennung', 
                tech: 'ki_anwendungen', 
                name: 'DigIDe 2.0',
                description: 'DigiDee 2.0 entwickelt ein digitales Tool zur Früherkennung von Demenz bei Menschen mit intellektueller Behinderung.',
                link: 'https://bildungsforschung.uni-graz.at/de/unsere-forschung/inklusive-bildung-und-heilpaedagogische-psychologie/digide-und-digide-2.0/',
                organization: 'Universität Graz'
            },
                                                        {
                lat: 47.073830 , lng:  15.453909, 
                application: 'alltagszentriert', 
                tech: 'ki_anwendungen', 
                name: 'VR4Care',
                description: 'Gender-sensible Virtuelle Technologien zur Aktivierung von Senior/innen in der Langzeitpflege',
                link: 'https://projekte.ffg.at/projekt/3281602',
                organization: 'JOANNEUM RESEARCH'
            },
                                                        {
                lat: 47.074166 , lng: 15.455041 , 
                application: 'alltagszentriert', 
                tech: 'ki_anwendungen', 
                name: 'AR-Demenz',
                description: 'Geplantes Ergebnis von AR-Demenz ist die Bewertung des Potenzials von AR-gestützter Assistenz und der Aktivierung für Interventionen mit Menschen mit Demenz.',
                link: 'https://projekte.ffg.at/projekt/3311822',
                organization: 'JOANNEUM RESEARCH'
            },
                                                                    {
                lat:47.070512 , lng:15.437113,
                application: 'alltagszentriert', 
                tech: 'ki_anwendungen', 
                name: 'Emma',
                description: 'Emma ist eine flexible Lebensassistenz (sprachgesteuert), um den Alltag älterer und pflegebedürftiger Menschen zu erleichtern.',
                link: 'https://startups.forbes.at/artikel/emma',
                organization: 'Emma'
            },
                                                                                {
                lat: 47.064268 , lng:15.430178,
                application: 'alltagszentriert', 
                tech: 'ki_anwendungen', 
                name: 'ilvi',
                description: 'Das steirische Digital Health-Startup ilvi GmbH entwickelte gemeinsam mit den GGZ eine digitale Lösung zur Optimierung der Übertragung von diagnostischen Daten in ein Krankenhaus-/Pflegeheim-Informationssystem (KIS). ',
                link: 'https://ggz.graz.at/2024/teleleios-award-2024/',
                organization: 'ilvi GmbH'
            },
                                                                                            {
                lat: 47.063734, lng:15.428789,
                application: 'alltagszentriert', 
                tech: 'ki_anwendungen', 
                name: 'Virtual Reality in Medizin und Therapie',
                description: 'Die GGZ nutzen VR Brillen in der Therapie von Menschen mit Demenz',
                link: 'https://ggz.graz.at/2023/virtual-reality-in-medizin-und-therapie/',
                organization: 'GGZ'
            },
                                                                                                        {
                lat: 47.080656, lng:15.468728,
                application: 'alltagszentriert', 
                tech: 'ki_anwendungen',

                description: 'Smarte Aktivierung zur Verbesserung Kognitiver Leistungsfähigkeit durch Entscheidungsassistenz und Digitale Biomarker',
                link: 'https://projekte.ffg.at/projekt/4832823',
                organization: 'JOANNEUM RESEARCH'
            },
                                                                                                                    {
                lat: 47.038576, lng:15.419464,
                application: 'alltagszentriert',

                name: 'KI-gestützte Überwachung',
                description: 'Im LKH II Graz, Standort Süd wird eine innovative Schweizer Technologie (Qumea), eine Kombination aus "Radarüberwachung und Künstlicher Intelligenz", zur Verbesserung der Patient:innen-Sicherheit getestet.',

            },

                lat: 47.079969, lng:15.469978,
                application: 'alltagszentriert',

                name: 'N!CA',
                description: 'Entwicklung neuer und innovativer KI (Künstliche Intelligenz)-Modelle auf der Grundlage von Echtweltdaten.',
                link: 'https://projekte.ffg.at/projekt/4856655',
                organization: 'Medizinische Universität Graz'
            },
                                                                                                                                            {
                lat: 47.079862, lng: 15.469632,
                application: 'alltagszentriert', 
                tech: 'ki_anwendungen', 
                name: 'PLAYTIME',
                description: 'PLAYTIME entwickelt ein „Serious Game“ für Demenzbetroffene mit einem Konzept für multimodales Training. Wissenschaftliche Studien zeigten, dass sensomotorische und soziale Aktivitäten einen positiven Effekt auf den Fortlauf der Demenzkrankheit ausüben können, dabei ist die Motivation für die tägliche Übung von fundamentaler Bedeutung.',
                link: 'https://projekte.ffg.at/projekt/1772998',
                organization: 'JOANNEUM RESEARCH'
            },
                                                                                                                                                        {
                lat: 47.080699, lng: 15.468321,
                application: 'alltagszentriert', 
                tech: 'ki_anwendungen', 
                name: 'OpenSense',
                description: 'Open Innovation zur Potentialbewertung für Virtuelles Achtsamkeitstraining und Imagination für Menschen mit Demenz.',
                link: 'https://projekte.ffg.at/projekt/3314712',
                organization: 'JOANNEUM RESEARCH'
            },
                                                                                                                                                                    {
                lat: 47.065151, lng: 15.409892,
                application: 'frueherkennung', 
                tech: 'ki_datenanalyse_biologische_daten', 
                name: 'BrainCheck',
                description: 'Frühdiagnose von Demenz mittels KI basierter Analyse der Gehirnaktivität während kognitiver Tests',
                link: 'https://projekte.ffg.at/projekt/3867128',
                organization: 'AIT Austrian Institute of Technology GmbH'
            }
            
            
                                                                

            // Hier die anderen Projekte in ähnlicher Weise hinzufügen
        ];

        // Gruppe für die Marker erstellen
        var markerLayer = L.layerGroup().addTo(map);

        // Marker zur Gruppe hinzufügen
        var markers = [];

        locations.forEach(function(location) {
            var marker = L.marker([location.lat, location.lng])
                .bindPopup(`<b>${location.name}</b><br>${location.description}<br><a href="${location.link}" target="_blank">Mehr erfahren</a><br><i>${location.organization}</i>`);
            marker.application = location.application;  // Füge den Anwendungsbereich hinzu
            marker.tech = location.tech;  // Füge die Technologie hinzu
            markers.push(marker);
        });

        // Funktion zum Anwenden der Filter
        function applyFilters() {
            var applicationFilter = document.getElementById('application-filter').value;
            var techFilter = document.getElementById('tech-filter').value;

            markerLayer.clearLayers();  // Alle Marker entfernen
            
            // Marker filtern und wieder hinzufügen
            markers.forEach(function(marker) {
                if ((applicationFilter === 'all' || marker.application === applicationFilter) &&
                    (techFilter === 'all' || marker.tech === techFilter)) {
                    markerLayer.addLayer(marker);  // Marker wieder hinzufügen
                }
            });
        }

        // Initial alle Marker anzeigen
        applyFilters();
    </script>

</body>
</html>
